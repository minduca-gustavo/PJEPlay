<body>

<div class="assistente-shell">

  <!-- CABEÇALHO: faixa 1 — marca + tarefa -->
  <header class="assistente-header">
    <span class="assistente-marca">ROTA PJE</span>
    <span class="assistente-sep">·</span>
    <span class="assistente-tarefa" id="gestao-tarefa">Assistente de Gestão</span>
    <button class="assistente-btn-fechar" id="btn-fechar-gestao" title="Fechar">×</button>
  </header>

  <!-- CABEÇALHO: faixa 2 — processo + posição -->
  <div class="assistente-subheader">
    <span class="assistente-num-processo" id="gestao-processo">Cadastre/consulte aqui os dados de perito, tabela de Juízes em atividades, modelos de despachos, etc.</span>
    <span class="assistente-posicao"      id="nav-posicao">Secretaria Conjunta de Bauru</span>
  </div>

  <!-- CORPO ROLÁVEL — preenchido pelo roteiro da tarefa -->
  <div class="assistente-corpo" id="rota_corpo_gestao">
    <!-- criarCarregando() é inserido aqui pelo assistente.js -->
    <!-- removerCarregando() + cria*() são chamados pelo roteiro -->
  </div>

  <!-- RODAPÉ FIXO — preenchido pelo assistente.js -->
  <!--<footer class="assistente-rodape" id="rota-rodape_gestao">-->
    <!-- criaBotaoProximoEEncerrar() é inserido aqui pelo assistente.js -->
  <!--</footer>-->

</div>
